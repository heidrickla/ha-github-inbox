name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Gitea reads .github/workflows too, so every job here is gated to github.com.
# Elsewhere they skip instantly and .gitea/workflows/validate.yml is what runs.

# Nothing here writes to the repository, publishes, or comments on a pull
# request. Each job reads the repository and nothing else.
permissions: {}

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3; it brings pytest, its asyncio
      # and aiohttp plugins, pytest-cov, PyYAML and Pillow with it (pinning
      # those again here makes the resolution impossible). uv installs the
      # same packages as pip did (compared 2026-10-30) in a quarter of the
      # time; 0.11.31 is the uv the harness itself pins.
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install "uv==0.11.31"
          .venv/bin/python -m uv pip install --python .venv/bin/python "mypy==1.18.2" "ruff==0.15.21" "pytest-homeassistant-custom-component==0.13.357"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      # pyproject already sets -q; a second one here would hide the summary line.
      - run: .venv/bin/python -m pytest tests --cov=custom_components/github_inbox --cov-report=term-missing --cov-fail-under=95
      - run: .venv/bin/python -m mypy custom_components/github_inbox
      - run: .venv/bin/python tools/validate_local.py
